<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>FunnyStreamTools - Windows Terminal (CMD Interactive & Ping)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: transparent;
            font-family: 'Consolas', 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            position: relative;
            padding: 4px;
        }

        .window {
            width: 100%;
            height: 100%;
            background-color: #c0c0c0;
            display: flex;
            flex-direction: column;
            border: 3px solid;
            border-color: #ffffff #0a0a0a #0a0a0a #ffffff;
            box-shadow: inset 1px 1px 0px #dfdfdf, inset -1px -1px 0px #808080;
            border-radius: 0;
            z-index: 1;
            position: relative;
            padding: 2px;
        }

        .title-bar {
            background: linear-gradient(90deg, #000080, #1046d0);
            height: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 6px;
            padding-right: 4px;
            user-select: none;
            flex-shrink: 0;
        }

        .title-text {
            color: #ffffff;
            font-family: "MS Sans Serif", Arial, sans-serif;
            font-size: 18px;
            font-weight: bold;
        }

        .window-controls {
            display: flex;
            height: 100%;
            align-items: center;
            gap: 2px;
        }

        .control-btn {
            width: 16px;
            height: 16px;
            background-color: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #0a0a0a #0a0a0a #ffffff;
            color: #000000;
            font-family: "MS Sans Serif", Arial, sans-serif;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            padding-bottom: 2px;
        }

        .control-btn.close {
            font-size: 11px;
            padding-bottom: 0px;
        }

        .control-btn:active {
            border-color: #0a0a0a #ffffff #ffffff #0a0a0a;
            padding-top: 2px;
            padding-left: 2px;
        }

        .control-btn.close:hover, .control-btn:not(.close):hover {
            background-color: #c0c0c0;
            color: #000000;
        }

        .terminal-container {
            position: relative;
            flex-grow: 1;
            overflow: hidden;
            background-color: #000000;
            margin: 4px;
            border: 3px solid;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .terminal-body {
            padding: 6px 10px;
            height: 100%;
            overflow-y: auto;

            font-family: "MS Sans Serif", "Courier New", Courier, monospace;
            font-smooth: never;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: none;

            &::-webkit-scrollbar { display: none; }
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .line {
            word-wrap: break-word;
            color: #c0c0c0;
            font-size: 20px;
            line-height: 20px;
            margin-bottom: 4px;
            position: relative;
        }
        [class*="cmd-color-"] .line,
        [class*="cmd-color-"] .prefix,
        [class*="cmd-color-"] .text,
        [class*="cmd-color-"] .system-log {
            color: inherit !important;
        }

        .user { color: #00ff00; font-weight: normal; }
        .prefix { color: #ffffff; }
        .text { color: #ffffff; }
        .system-log { color: #ffffff; }
        .system-error { color: #ff5555; }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background-color: currentColor;
            margin-left: 1px;
            vertical-align: bottom;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        #matrixCanvas {
            position: absolute;
            top: 28px;
            left: 0;
            width: 100%;
            height: calc(100% - 28px);
            z-index: 10;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .emote {
            height: 1.2em;
            vertical-align: middle;
            margin: 0 2px;
            image-rendering: pixelated;
            transition: filter 0.3s ease;
        }

        .matrix-image-glitch {
            filter: brightness(0.5) sepia(1) hue-rotate(70deg) saturate(5) contrast(2) drop-shadow(0 0 3px #00ff00) !important;
        }

        .cmd-color-0 { color: #000000 !important; }
        .cmd-color-1 { color: #000080 !important; }
        .cmd-color-2 { color: #008000 !important; }
        .cmd-color-3 { color: #008080 !important; }
        .cmd-color-4 { color: #800000 !important; }
        .cmd-color-5 { color: #800080 !important; }
        .cmd-color-6 { color: #808000 !important; }
        .cmd-color-7 { color: #c0c0c0 !important; }
        .cmd-color-8 { color: #808080 !important; }
        .cmd-color-9 { color: #0000ff !important; }
        .cmd-color-a { color: #00ff00 !important; }
        .cmd-color-b { color: #00ffff !important; }
        .cmd-color-c { color: #ff0000 !important; }
        .cmd-color-d { color: #ff00ff !important; }
        .cmd-color-e { color: #ffff00 !important; }
        .cmd-color-f { color: #ffffff !important; }

        .cmd-bg-0 { background-color: #000000 !important; }
        .cmd-bg-1 { background-color: #000080 !important; }
        .cmd-bg-2 { background-color: #008000 !important; }
        .cmd-bg-3 { background-color: #008080 !important; }
        .cmd-bg-4 { background-color: #800000 !important; }
        .cmd-bg-5 { background-color: #800080 !important; }
        .cmd-bg-6 { background-color: #808000 !important; }
        .cmd-bg-7 { background-color: #c0c0c0 !important; }
        .cmd-bg-8 { background-color: #808080 !important; }
        .cmd-bg-9 { background-color: #0000ff !important; }
        .cmd-bg-a { background-color: #00ff00 !important; }
        .cmd-bg-b { background-color: #00ffff !important; }
        .cmd-bg-c { background-color: #ff0000 !important; }
        .cmd-bg-d { background-color: #ff00ff !important; }
        .cmd-bg-e { background-color: #ffff00 !important; }
        .cmd-bg-f { background-color: #ffffff !important; }
    </style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div class="window">
    <div class="title-bar">
        <div class="title-text">C:\Windows\system32\cmd.exe</div>
        <div class="window-controls">
            <div class="control-btn">_</div>
            <div class="control-btn">🗖</div>
            <div class="control-btn close">✕</div>
        </div>
    </div>

    <div class="terminal-container" id="termContainer">
        <div class="terminal-body" id="terminal">
        </div>
    </div>
</div>

<script>
    const terminal = document.getElementById('terminal');
    const termContainer = document.getElementById('termContainer');
    const matrixCanvas = document.getElementById('matrixCanvas');
    const ctx = matrixCanvas.getContext('2d');
    const MAX_LINES = 35;
    const MAX_MESSAGE_LENGTH = 500;
    const ALLOWED_EMOTE_HOSTS = new Set([
        'static-cdn.jtvnw.net',
        'cdn.7tv.app',
        'cdn.betterttv.net',
        'cdn.frankerfacez.com'
    ]);
    let matrixInterval = null;
    let isMatrixRunning = false;
    let matrixSnapshotLines = [];
    let ws = null;

    const block = ['cd', 'md', 'mkdir', 'del', 'erase', 'copy', 'move', 'ren', 'rename', 'format', 'shutdown', 'exit', 'help'];
    const alphabet = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890*#$@%&'.split('');

    function safeColor(value, fallback = '#00ff00') {
        if (typeof value !== 'string') return fallback;
        const trimmed = value.trim();
        return /^#[0-9a-fA-F]{6}$/.test(trimmed) ? trimmed : fallback;
    }

    function safePlatform(value) {
        if (typeof value !== 'string') return 'stream';
        const cleaned = value.trim().replace(/[^a-zA-Z0-9_-]/g, '');
        return cleaned || 'stream';
    }

    function isSafeEmoteUrl(rawUrl) {
        if (typeof rawUrl !== 'string' || !rawUrl.trim()) return false;
        try {
            const parsed = new URL(rawUrl.trim());
            if (parsed.protocol !== 'https:') return false;
            if (parsed.username || parsed.password) return false;
            return ALLOWED_EMOTE_HOSTS.has(parsed.hostname);
        } catch {
            return false;
        }
    }

    function appendTextWithLineBreaks(containerEl, text) {
        const lines = String(text).split('\n');
        lines.forEach((part, idx) => {
            if (idx > 0) containerEl.appendChild(document.createElement('br'));
            containerEl.appendChild(document.createTextNode(part));
        });
    }

    function renderMessageContent(targetSpan, data) {
        targetSpan.textContent = '';

        if (Array.isArray(data.segments) && data.segments.length > 0) {
            const frag = document.createDocumentFragment();
            for (const seg of data.segments) {
                if (!seg || typeof seg !== 'object') continue;
                if (seg.type === 'text' && typeof seg.value === 'string') {
                    frag.appendChild(document.createTextNode(seg.value.slice(0, MAX_MESSAGE_LENGTH)));
                } else if (seg.type === 'emote' && isSafeEmoteUrl(seg.url)) {
                    const img = document.createElement('img');
                    img.className = 'emote';
                    img.src = seg.url.trim();
                    img.alt = typeof seg.name === 'string' ? seg.name : 'emote';
                    img.loading = 'lazy';
                    frag.appendChild(img);
                }
            }
            targetSpan.appendChild(frag);
            return;
        }

        const fallbackText = typeof data.text === 'string'
            ? data.text.slice(0, MAX_MESSAGE_LENGTH)
            : '';
        targetSpan.textContent = fallbackText;
    }

    function playTerminalBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime);
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.04);
            oscillator.stop(audioCtx.currentTime + 0.04);
        } catch (e) {}
    }

    function typeEffect(element, text, speed, callback) {
        const safeText = String(text).slice(0, MAX_MESSAGE_LENGTH);
        let i = 0;
        element.textContent = '';
        function type() {
            if (i < safeText.length) {
                element.textContent += safeText.charAt(i);
                i++;
                setTimeout(type, speed);
            } else if (callback) {
                callback();
            }
        }
        type();
    }

    function updateCursorPosition() {
        const oldCursors = terminal.querySelectorAll('.cursor');
        oldCursors.forEach(c => c.remove());

        const lines = terminal.getElementsByClassName('line');
        if (lines.length === 0) return;

        const lastLine = lines[lines.length - 1];
        const cursor = document.createElement('span');
        cursor.className = 'cursor';
        lastLine.appendChild(cursor);

        terminal.scrollTop = terminal.scrollHeight;
    }

    function cleanupOldLines() {
        const lines = terminal.getElementsByClassName('line');
        while (lines.length > MAX_LINES) {
            terminal.removeChild(lines[0]);
        }
    }

    function recordMatrixSnapshot(lineEl) {
        if (!isMatrixRunning) return;
        matrixSnapshotLines.push(lineEl.cloneNode(true));
        if (matrixSnapshotLines.length > MAX_LINES) {
            matrixSnapshotLines.splice(0, matrixSnapshotLines.length - MAX_LINES);
        }
    }

    function printPingRow(text, color = '#cccccc') {
        const line = document.createElement('div');
        line.className = 'line system-log';
        line.style.color = safeColor(color, '#cccccc');
        appendTextWithLineBreaks(line, text);

        if (isMatrixRunning) {
            line.style.setProperty('color', '#00ff00', 'important');
            glitchElementImmediately(line);
        }

        terminal.appendChild(line);
        cleanupOldLines();
        updateCursorPosition();
        recordMatrixSnapshot(line);
    }

    function runPingProcess() {
        printPingRow('\nPinging 127.0.0.1 with 32 bytes of data:');
        let repliesCount = 0;
        const replyInterval = setInterval(() => {
            repliesCount++;
            playTerminalBeep();
            printPingRow('Reply from 127.0.0.1: bytes=32 time<1ms TTL=128');
            if (repliesCount === 4) {
                clearInterval(replyInterval);
                setTimeout(() => {
                    const stats =
                        '\nPing statistics for 127.0.0.1:\n' +
                        '    Packets: Sent = 4, Received = 4, Lost = 0 (0% loss),\n' +
                        'Approximate round trip times in milli-seconds:\n' +
                        '    Minimum = 0ms, Maximum = 0ms, Average = 0ms\n\n';
                    printPingRow(stats);
                }, 1000);
            }
        }, 1000);
    }

    function glitchElementImmediately(element) {
        const imgs = element.querySelectorAll('img');
        imgs.forEach(img => img.classList.add('matrix-image-glitch'));

        const walk = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
        let node;
        while ((node = walk.nextNode())) {
            if (node.parentElement && node.parentElement.classList.contains('cursor')) continue;
            const chars = node.nodeValue.split('');
            for (let i = 0; i < chars.length; i++) {
                if (chars[i] !== ' ' && chars[i] !== '\n' && chars[i] !== '\u00A0') {
                    chars[i] = alphabet[Math.floor(Math.random() * alphabet.length)];
                }
            }
            node.nodeValue = chars.join('');
        }
    }

    function glitchTerminalText(direction = 'eat', callback) {
        const cursor = terminal.querySelector('.cursor');
        if (cursor) cursor.remove();

        const textNodes = [];
        const walk = document.createTreeWalker(terminal, NodeFilter.SHOW_TEXT, null, false);
        let node;

        while ((node = walk.nextNode())) {
            if (node.nodeValue.trim().length > 0) {
                textNodes.push({
                    node: node,
                    original: node.nodeValue,
                    current: node.nodeValue.split('')
                });
            }
        }

        const images = terminal.querySelectorAll('img');
        let steps = 0;
        const maxSteps = 30;

        const glitchInterval = setInterval(() => {
            steps++;
            const progress = steps / maxSteps;

            images.forEach(img => {
                if (direction === 'eat') {
                    if (Math.random() < progress) img.classList.add('matrix-image-glitch');
                } else {
                    if (Math.random() < progress) img.classList.remove('matrix-image-glitch');
                }
            });

            textNodes.forEach((tData) => {
                for (let i = 0; i < tData.original.length; i++) {
                    if (tData.original[i] === ' ' || tData.original[i] === '\n' || tData.original[i] === '\u00A0') continue;

                    if (direction === 'eat') {
                        if (Math.random() < progress) {
                            tData.current[i] = alphabet[Math.floor(Math.random() * alphabet.length)];
                            if (tData.node.parentElement) {
                                tData.node.parentElement.style.setProperty('color', '#00ff00', 'important');
                                tData.node.parentElement.style.textShadow = '0 0 5px rgba(0, 255, 0, 0.6)';
                            }
                        }
                    } else if (direction === 'restore') {
                        if (Math.random() < progress) {
                            tData.current[i] = tData.original[i];
                            if (tData.node.parentElement) {
                                tData.node.parentElement.style.color = '';
                                tData.node.parentElement.style.textShadow = '';
                            }
                        } else {
                            tData.current[i] = alphabet[Math.floor(Math.random() * alphabet.length)];
                        }
                    }
                }
                tData.node.nodeValue = tData.current.join('');
            });

            if (steps >= maxSteps) {
                clearInterval(glitchInterval);
                if (direction === 'restore') {
                    terminal.textContent = '';
                    const frag = document.createDocumentFragment();
                    matrixSnapshotLines.forEach(el => frag.appendChild(el));
                    terminal.appendChild(frag);
                    cleanupOldLines();
                    matrixSnapshotLines = [];
                }
                updateCursorPosition();
                if (callback) callback();
            }
        }, 50);
    }

    function runCanvasRain(duration, callback) {
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight - 28;
        matrixCanvas.style.opacity = '0.35';

        const rainAlphabet = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890ABCDEF'.split('');
        const fontSize = 24;
        const columns = Math.max(1, Math.floor(matrixCanvas.width / fontSize));
        const rainDrops = Array(columns).fill(1);

        const draw = () => {
            ctx.fillStyle = 'rgba(12, 12, 12, 0.06)';
            ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
            ctx.fillStyle = '#00ff00';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = rainAlphabet[Math.floor(Math.random() * rainAlphabet.length)];
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                if (rainDrops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        };

        matrixInterval = setInterval(draw, 33);

        setTimeout(() => {
            matrixCanvas.style.opacity = '0';
            setTimeout(() => {
                clearInterval(matrixInterval);
                matrixInterval = null;
                ctx.clearRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                if (callback) callback();
            }, 500);
        }, duration);
    }

    function startMatrixEffect() {
        if (isMatrixRunning) return;
        isMatrixRunning = true;

        const cursor = terminal.querySelector('.cursor');
        if (cursor) cursor.remove();

        matrixSnapshotLines = Array.from(terminal.getElementsByClassName('line'))
            .slice(-MAX_LINES)
            .map(el => el.cloneNode(true));

        glitchTerminalText('eat', () => {
            runCanvasRain(3500, () => {
                glitchTerminalText('restore', () => {
                    isMatrixRunning = false;
                });
            });
        });
    }

    function clearConsoleLog() {
        terminal.textContent = '';
        matrixSnapshotLines = [];
        const line = document.createElement('div');
        line.className = 'line system-log';
        const prefix = document.createElement('span');
        prefix.className = 'prefix';
        prefix.textContent = 'C:\\system> ';
        line.append(prefix, document.createTextNode('Console buffer cleared. Done.'));
        terminal.appendChild(line);
        updateCursorPosition();
    }

    function initWebSocket() {
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const widgetName = window.location.pathname.split('/').filter(Boolean).pop() || '';
        ws = new WebSocket(`${protocol}//${window.location.host}/widget/${encodeURIComponent(widgetName)}/ws`);

        ws.onmessage = function(event) {
            let packet;
            try {
                packet = JSON.parse(event.data);
            } catch {
                return;
            }

            if (!packet || typeof packet !== 'object' || typeof packet.topic !== 'string') return;
            const data = packet.data && typeof packet.data === 'object' ? packet.data : {};

            if (packet.topic.endsWith(':message')) {
                const rawText = typeof data.text === 'string' ? data.text.slice(0, MAX_MESSAGE_LENGTH) : '';
                const messageText = rawText.trim().toLowerCase().replace(/[\p{Cf}]/gu, '');
                const hasPermission = data.isMod === true;

                const words = rawText.trim().split(/\s+/).filter(Boolean);
                const firstWord = words[0] ? words[0].toLowerCase() : '';
                playTerminalBeep();

                const isBlockedCommand = block.includes(firstWord);

                if (hasPermission) {
                    if (messageText === '/clear') {
                        clearConsoleLog();
                        return;
                    }
                    if (messageText === 'matrix') {
                        startMatrixEffect();
                        return;
                    }
                }

                const line = document.createElement('div');
                line.className = 'line';
                const platform = safePlatform(data.platform);
                const safeUser = typeof data.user === 'string' && data.user.trim() ? data.user.trim() : 'anonymous';

                const prefixSpan = document.createElement('span');
                prefixSpan.className = 'prefix';
                prefixSpan.textContent = `C:\\chat\\${platform}> `;

                const userSpan = document.createElement('span');
                userSpan.className = 'user';
                userSpan.style.color = safeColor(data.color, '#00ff00');
                userSpan.textContent = `[${safeUser}] `;

                const textSpan = document.createElement('span');
                textSpan.className = 'text';
                textSpan.appendChild(document.createTextNode(':: '));
                const contentSpan = document.createElement('span');
                textSpan.appendChild(contentSpan);

                line.append(prefixSpan, userSpan, textSpan);

                if (isMatrixRunning) {
                    renderMessageContent(contentSpan, data);
                    line.style.setProperty('color', '#00ff00', 'important');
                    line.querySelectorAll('span').forEach(s => s.style.setProperty('color', '#00ff00', 'important'));
                    glitchElementImmediately(line);

                    terminal.appendChild(line);
                    cleanupOldLines();
                    updateCursorPosition();
                    recordMatrixSnapshot(line);
                } else {
                    terminal.appendChild(line);
                    cleanupOldLines();
                    updateCursorPosition();

                    typeEffect(contentSpan, rawText, 10, () => {
                        renderMessageContent(contentSpan, data);
                        updateCursorPosition();

                        if (isBlockedCommand) {
                            printPingRow(`'${words[0] || ''}' is not recognized as an internal or external command,\noperable program or batch file.`);
                            return;
                        }

                        if (hasPermission && messageText === 'ping') {
                            runPingProcess();
                        }
                    });
                }

                if (!isBlockedCommand) {
                    if (messageText === 'dir') {
                        printPingRow('Directory of C:\\stream\n08.07.2026  04:24    <DIR>          logs\n08.07.2026  04:24    1,048,576      stream_data.db\n1 File(s)  1,048,576 bytes');
                    } else if (messageText === 'ipconfig') {
                        printPingRow('Ethernet adapter Ethernet:\n   IPv4 Address. . . . . : 192.168.1.137\n   Subnet Mask . . . . : 255.255.255.0');
                    } else if (messageText === 'systeminfo') {
                        printPingRow('OS Name: StreamOS 2026\nProcessor: Core_i9_Virtual\nSystem Uptime: 42 days');
                    } else if (messageText === 'whoami') {
                        printPingRow('stream_user');
                    } else if (messageText === 'tasklist') {
                        printPingRow('Image Name                     PID Session Name\n========================= ======== ================\nOBS.exe                       4320 Console\nTwitchBot.exe                 1240 Console\nHackingEngine.exe              890 Console');
                    } else if (messageText === 'tree') {
                        printPingRow('C:\\stream\n├── logs\n├── overlay\n└── modules');
                    } else if (firstWord === 'color' && hasPermission) {
                        const arg = words[1] ? words[1].toLowerCase() : '';
                        termContainer.className = 'terminal-container';

                        if (arg === '') {
                            termContainer.classList.add('cmd-color-f');
                            printPingRow('\nConsole colors have been reset to default.');
                        } else if (arg.length === 2 && /^[0-f]{2}$/.test(arg)) {
                            const bgAttr = arg.charAt(0);
                            const textAttr = arg.charAt(1);

                            if (bgAttr === textAttr) {
                                printPingRow('\nError: Text and background colors must not be the same.');
                            } else {
                                termContainer.classList.add(`cmd-bg-${bgAttr}`);
                                termContainer.classList.add(`cmd-color-${textAttr}`);
                            }
                        } else if (arg.length === 1 && /^[0-f]$/.test(arg)) {
                            termContainer.classList.add('cmd-bg-0');
                            termContainer.classList.add(`cmd-color-${arg}`);
                        } else {
                            printPingRow('\nError: Invalid attribute. Use "color 3" or "color 0A"');
                        }
                    }
                }
            }

            if (packet.topic.endsWith(':clear') || data.text === 'system clear') {
                clearConsoleLog();
            }
        };
    }

    function startBootSequence() {
        const header = document.createElement('div');
        header.className = 'line system-log';
        header.style.marginBottom = '30px';
        appendTextWithLineBreaks(header, 'Microsoft(R) Windows WT(TM)\n(c) Copyright 1985-1996 Microsoft Corp.');
        terminal.appendChild(header);

        setTimeout(() => {
            const line1 = document.createElement('div');
            line1.className = 'line system-log';
            const prefix1 = document.createElement('span');
            prefix1.className = 'prefix';
            prefix1.textContent = 'C:\\FunnyStreamTools> ';
            const textSpan1 = document.createElement('span');
            textSpan1.className = 'cmd-text';
            line1.append(prefix1, textSpan1);
            terminal.appendChild(line1);
            updateCursorPosition();

            typeEffect(textSpan1, 'boot --init', 80, () => {
                playTerminalBeep();
                updateCursorPosition();

                const line2 = document.createElement('div');
                line2.className = 'line system-log';
                line2.textContent = 'connecting to CoreEngine via WebSocket...';
                terminal.appendChild(line2);
                updateCursorPosition();

                setTimeout(() => {
                    const successLine = document.createElement('div');
                    successLine.className = 'line system-log';
                    successLine.textContent = 'SUCCESS: Connected to EventBus active context.';
                    terminal.appendChild(successLine);
                    playTerminalBeep();
                    updateCursorPosition();

                    initWebSocket();
                }, 1500);
            });
        }, 500);
    }

    startBootSequence();

    window.addEventListener('resize', () => {
        if (isMatrixRunning) {
            matrixCanvas.width = window.innerWidth;
            matrixCanvas.height = window.innerHeight - 28;
        }
    });
</script>
