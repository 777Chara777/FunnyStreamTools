[project]
name = "funnystreamtools"
version = "0.1.0"
description = "FunnyStreamTools is a lightweight, modular, and highly customizable streaming utility designed aesthetic to your live broadcasts. It bridges your streaming platforms (Twitch, Discord, etc.) directly into a beautiful, terminal-inspired overlay for OBS."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.139.0",
    "pyright>=1.1.414",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "ruff>=0.17.6",
    "uvicorn>=0.50.2",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]

[tool.ruff.lint]
ignore = [
  "BLE001",
  "B008",
]
