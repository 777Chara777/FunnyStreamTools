<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Emoji Combo Overlay</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: transparent;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial Black', Impact, sans-serif;
            position: relative;
        }

        #combo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0;
            transform: scale(0.3);
            transition: opacity 0.25s ease, transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.3);
            pointer-events: none;
            z-index: 10;
        }

        #combo-container.active {
            opacity: 1;
            transform: scale(1);
        }

        .combo-emote {
            width: 250px;
            height: 250px;
            object-fit: contain;
            image-rendering: pixelated;
            filter: drop-shadow(0px 10px 20px rgba(0, 0, 0, 0.6));
        }

        .combo-text {
            font-size: 120px;
            color: #fff;
            text-shadow:
                -4px -4px 0 #000,
                 4px -4px 0 #000,
                -4px  4px 0 #000,
                 4px  4px 0 #000,
                 0px  15px 30px rgba(0, 0, 0, 0.9);
            font-style: italic;
            white-space: nowrap;
            line-height: 1;
        }

        @keyframes super-hit {
            0% { transform: scale(1) rotate(0deg); }
            15% { transform: scale(1.5) rotate(-8deg); filter: brightness(1.5); }
            30% { transform: scale(1.1) rotate(5deg); }
            45% { transform: scale(1.25) rotate(-3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .hit {
            animation: super-hit 0.35s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
    </style>
</head>
<body>

<div id="combo-container">
    <div class="emote-wrapper">
        <img id="emote" class="combo-emote" src="" alt="">
    </div>
    <div id="text" class="combo-text">x0</div>
</div>

<script>
    const container = document.getElementById('combo-container');
    const emoteImg = document.getElementById('emote');
    const textSpan = document.getElementById('text');

    const ALLOWED_HOSTS = new Set([
        'static-cdn.jtvnw.net',
        'cdn.7tv.app',
        'cdn.betterttv.net',
        'cdn.frankerfacez.com'
    ]);

    let ws = null;
    let fadeTimeout = null;
    let reconnectTimeout = null;

    function isSafeEmoteUrl(rawUrl) {
        if (typeof rawUrl !== 'string' || !rawUrl.trim()) {
            return false;
        }
        try {
            const parsed = new URL(rawUrl.trim());
            if (parsed.protocol !== 'https:') {
                return false;
            }
            if (parsed.username || parsed.password) {
                return false;
            }
            return ALLOWED_HOSTS.has(parsed.hostname);
        } catch {
            return false;
        }
    }

    function hideCombo() {
        clearTimeout(fadeTimeout);
        fadeTimeout = null;
        container.classList.remove('active');
    }

    function showCombo(emoteUrl, count) {
        if (!isSafeEmoteUrl(emoteUrl)) {
            return;
        }
        const safeCount = Number.isFinite(count) && count >= 2 ? Math.floor(count) : 0;
        if (safeCount < 2) {
            return;
        }

        clearTimeout(fadeTimeout);

        emoteImg.src = emoteUrl.trim();
        emoteImg.alt = `Combo x${safeCount}`;
        textSpan.textContent = `x${safeCount}`;

        container.classList.add('active');
        container.classList.remove('hit');
        void container.offsetWidth;
        container.classList.add('hit');

        fadeTimeout = setTimeout(() => {
            container.classList.remove('active');
        }, 3000);
    }

    function initWebSocket() {
        if (reconnectTimeout) {
            clearTimeout(reconnectTimeout);
            reconnectTimeout = null;
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        const widgetName = window.location.pathname.split('/').filter(Boolean).pop() || '';
        const wsUrl = `${protocol}//${window.location.host}/widget/${encodeURIComponent(widgetName)}/ws`;

        ws = new WebSocket(wsUrl);

        ws.onmessage = function(event) {
            let payload;
            try {
                payload = JSON.parse(event.data);
            } catch {
                return;
            }

            if (!payload || typeof payload !== 'object') {
                return;
            }

            if (payload.type === 'combo' && Number(payload.count) >= 2) {
                showCombo(payload.emote, Number(payload.count));
            } else if (payload.type === 'reset') {
                hideCombo();
            }
        };

        ws.onerror = function(err) {
            console.warn('Emoji combo WebSocket error:', err);
        };

        ws.onclose = function() {
            reconnectTimeout = setTimeout(initWebSocket, 3000);
        };
    }

    initWebSocket();
</script>
</body>
</html>
